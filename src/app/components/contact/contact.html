<section id="contact" class="lets-work-section">
  <div class="lets-work-wrapper">

    <!-- SUCCESS OVERLAY (Shows after user clicks "Let's work together") -->
    <div class="success-overlay" [class.show]="showSuccess()">
      <div class="success-heading-box">
        <span class="success-subtitle">Perfect</span>
        <h3 class="success-title">LET'S TALK</h3>
      </div>

      <!-- Send me a message button (WhatsApp) -->
      <button
        type="button"
        (click)="handleSendMessage()"
        (mouseenter)="setButtonHover(true)"
        (mouseleave)="setButtonHover(false)"
        class="book-call-btn-wrapper"
        [class.btn-hovered]="isButtonHovered()"
      >
        <!-- Left Line -->
        <div class="btn-line-left"></div>

        <!-- Button Content -->
        <div class="book-call-pill">
          <i class="fa-brands fa-whatsapp whatsapp-btn-icon"></i>
          <span class="book-call-text">Send me a message</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-up-right-icon">
            <path d="M7 7h10v10"/>
            <path d="M17 7 7 17"/>
          </svg>
        </div>

        <!-- Right Line -->
        <div class="btn-line-right"></div>
      </button>

      <span class="subtext-intro">Direct WhatsApp message</span>
    </div>

    <!-- INITIAL STATE: AVAILABLE BADGE -->
    <div class="availability-badge" [class.clicked]="isClicked()">
      <span class="status-dot-container">
        <span class="status-dot-ping"></span>
        <span class="status-dot-solid"></span>
      </span>
      <span class="availability-text">Available for projects</span>
    </div>

    <!-- INITIAL STATE: INTERACTIVE HEADLINE & BUTTON -->
    <div
      class="headline-trigger-group"
      [class.hovered]="isHovered()"
      [class.clicked]="isClicked()"
      (mouseenter)="setHover(true)"
      (mouseleave)="setHover(false)"
      (click)="handleClick($event)"
    >
      <div class="headline-content-box">
        <h2 class="lets-work-heading">
          <span class="heading-line-mask">
            <span class="heading-line-text">LET'S WORK</span>
          </span>
          <span class="heading-line-mask">
            <span class="heading-line-text delay-line">
              <span class="muted-together">TOGETHER</span>
            </span>
          </span>
        </h2>

        <div class="circle-btn-container">
          <div class="circle-btn-ring"></div>
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="circle-arrow-icon">
            <path d="M7 7h10v10"/>
            <path d="M17 7 7 17"/>
          </svg>
        </div>
      </div>

      <!-- Side Accent Lines -->
      <div class="headline-side-line-left">
        <div class="headline-line-inner"></div>
      </div>
      <div class="headline-side-line-right">
        <div class="headline-line-inner"></div>
      </div>
    </div>

    <!-- INITIAL STATE: BOTTOM SUBTEXT -->
    <div class="bottom-info-box" [class.clicked]="isClicked()">
      <p class="bottom-info-desc">
        Have a project in mind? I'd love to hear about it. Let's create something exceptional together.
      </p>
      <a href="mailto:arun@adcutstudios.in" class="bottom-info-email">arun@adcutstudios.in</a>
    </div>

    <!-- FOOTER SOCIAL LINKS ROW -->
    <div class="contact-footer-row">
      <div class="social-icons-group">
        <a href="https://instagram.com/arun.chelani" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.imdb.com/name/nm18802275/?ref_=nv_sr_srsg_0_tt_5_nm_3_in_0_q_arun%20chelani" target="_blank" aria-label="IMDb"><i class="fa-brands fa-imdb"></i></a>
        <a href="https://wa.me/917600416755?text=Hi%20Arun,%20I'd%20like%20to%20discuss%20a%20project!" target="_blank" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="mailto:arun@adcutstudios.in" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
      </div>

      <div class="collab-note">
        <span>📍 Based in Mumbai &nbsp;|&nbsp; ✌️ Open for collaborations worldwide. Say hello! 🖐️</span>
      </div>
    </div>

  </div>
</section>
